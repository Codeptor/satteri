[project]
name = "trench-ml"
version = "0.1.0"
description = "Offline training and local inference for Trench paper trading"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arch",
    "blake3",
    "lightgbm",
    "msgspec",
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "scipy",
    "shap",
]

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trench_ml"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "TC"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src/trench_ml"]

[tool.uv]
constraint-dependencies = [
    "llvmlite>=0.44,<0.45",
    "numba>=0.61.2,<0.62",
    "numpy>=2.2,<2.3",
]
