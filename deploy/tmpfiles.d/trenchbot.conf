# Keep every service-writable path explicit and private. Configuration and
# release trees are installed by the root-owned release installer.
d /etc/trenchbot 0750 root trenchbot -
d /var/lib/trenchbot 0700 trenchbot trenchbot -
d /var/lib/trenchbot/sqlite 0700 trenchbot trenchbot -
d /var/lib/trenchbot/parquet 0700 trenchbot trenchbot -
d /var/lib/trenchbot/models 0700 trenchbot trenchbot -
d /var/backups/trenchbot 0700 trenchbot trenchbot -
d /run/trenchbot 0700 trenchbot trenchbot -
