[workspace]
members = [
    "crates/trench-core",
    "crates/trench-hyperliquid",
    "crates/trench-storage",
    "crates/trenchd",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Codeptor/satteri"
rust-version = "1.93"

[workspace.dependencies]
anyhow = "1.0.100"
arrow-array = "56.2.0"
arrow-schema = "56.2.0"
async-trait = "0.1.89"
blake3 = "1.8.2"
bytes = "1.10.1"
clap = { version = "4.5.47", features = ["derive"] }
futures-util = "0.3.31"
libm = "0.2.16"
parquet = "56.2.0"
proptest = "1.7.0"
rand = "0.9.2"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1.37.2", features = ["serde"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
rust_decimal_macros = "1.37.0"
sd-notify = "0.5.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sqlx = { version = "0.8.6", default-features = false, features = ["macros", "migrate", "runtime-tokio-rustls", "sqlite"] }
tempfile = "3.21.0"
thiserror = "2.0.16"
time = { version = "0.3.43", features = ["serde"] }
tokio = { version = "1.47.1", features = ["full"] }
tokio-tungstenite = { version = "0.27.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = "0.7.16"
toml = "0.9.5"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
wiremock = "0.6.4"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
